<!-- Fallback for direct Supabase signups; the app sends the native signup OTP through Resend. -->

  <p style="font-size:22px;font-weight:700;margin:0 0 18px">splatno</p>
  <h1 style="font-size:24px;margin:0 0 12px">Ověření účtu</h1>

</div>
