name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:migrations
      - run: pnpm audit:ci
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          EMAIL_MFA_SECRET: ci-placeholder-secret-with-at-least-32-characters
          RESEND_API_KEY: re_ci-placeholder
          RESEND_WEBHOOK_SECRET: whsec_ci-placeholder
          CRON_SECRET: ci-placeholder-secret-with-at-least-32-characters
          APP_BASE_URL: https://ci.example.com
          REMINDER_EMAIL_FROM: Splatno CI <ci@example.com>
          AUTH_EMAIL_FROM: Splatno CI <ci@example.com>
          AUTH_EMAIL_DELIVERY_ENABLED: "false"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
