name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:migrations
      - run: pnpm audit:ci
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          EMAIL_MFA_SECRET: ci-placeholder-secret-with-at-least-32-characters
          RESEND_API_KEY: re_ci-placeholder
          RESEND_WEBHOOK_SECRET: whsec_ci-placeholder
          CRON_SECRET: ci-placeholder-secret-with-at-least-32-characters
          APP_BASE_URL: https://ci.example.com
          REMINDER_EMAIL_FROM: Splatno CI <ci@example.com>
          AUTH_EMAIL_FROM: Splatno CI <ci@example.com>
          AUTH_EMAIL_DELIVERY_ENABLED: "false"
      # Vsechny projekty krome desktop-safari bezi na Chromiu (i Pixel 5 --
      # Playwright ho emuluje pres Chromium, ne pres skutecny Android
      # prohlizec). desktop-safari pouziva WebKit. Kdyz CI instaluje jen
      # chromium, kazdy test na desktop-safari selze uz na startu prohlizece
      # -- to neni 35 nesouvisejicich chyb, je to jedna chybejici zavislost.
      - run: pnpm exec playwright install --with-deps chromium webkit
      # Krok driv bezel uplne bez env, takze dev server nemel zadne pripojeni
      # k Supabase a KAZDY workspace test se tise preskocil -- realne bezel
      # jediny test a CI pritom svitilo zelene.
      #
      # E2E_ALLOW_UNAUTHENTICATED je vedomy, docasny ustupek: mezera je ted
      # aspon videt tady v konfiguraci misto aby byla schovana v testech.
      # ODSTRANIT, az budou v repository secrets E2E_EMAIL a E2E_PASSWORD
      # (ucet test-admin@hlavica.cz, ktery obchazi MFA) plus skutecne
      # Supabase udaje -- teprve pak zacne tahle sada neco overovat.
      - run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || 'ci-placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || 'ci-placeholder' }}
          EMAIL_MFA_SECRET: ci-placeholder-secret-with-at-least-32-characters
          RESEND_API_KEY: re_ci-placeholder
          RESEND_WEBHOOK_SECRET: whsec_ci-placeholder
          CRON_SECRET: ci-placeholder-secret-with-at-least-32-characters
          APP_BASE_URL: http://127.0.0.1:3000
          REMINDER_EMAIL_FROM: Splatno CI <ci@example.com>
          AUTH_EMAIL_FROM: Splatno CI <ci@example.com>
          AUTH_EMAIL_DELIVERY_ENABLED: "false"
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ALLOW_UNAUTHENTICATED: ${{ secrets.E2E_PASSWORD && 'false' || 'true' }}
